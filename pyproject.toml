[project]
name = "deslop-marcomm"
version = "0.1.0"
description = "Rebuild incoming graphics in rigorous NMSU branding"
requires-python = ">=3.11"
dependencies = [
    "uharfbuzz>=0.39",
    "fonttools>=4.40",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nmsu"]

[tool.mypy]
strict = true
files = ["nmsu", "jobs", "tests"]
mypy_path = "typings"
